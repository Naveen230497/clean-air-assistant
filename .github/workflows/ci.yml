name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Lint with ruff
        run: ruff check app tests
      - name: Lint with flake8
        run: flake8 app tests
      - name: Check docstrings with interrogate
        run: interrogate -vv --fail-under=95 app
      - name: Check complexity with radon
        run: test -z "$(radon cc -n C app)"
      - name: Lint with pylint
        run: pylint --fail-under=9.5 app
      - name: Run Python tests with coverage
        run: |
          python -W default -m coverage run --source=app -m unittest discover -s tests -t .
          python -m coverage report --fail-under=90
      - name: Run Node tests
        run: node --test tests/
      - name: Lint frontend JS with ESLint
        run: npx --yes eslint@9.39.5 app/static/
