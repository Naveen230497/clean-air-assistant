[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [".venv", "app/static/leaflet.*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "C4", "SIM", "N", "D100", "D103", "UP"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.interrogate]
fail-under = 85
verbose = 1
exclude = [".venv", "app/static/leaflet.*"]

[tool.pylint.main]
ignore-paths = ["^app/static/leaflet\\.", "^\\.venv"]

[tool.pylint.format]
max-line-length = 120
